<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview · Acme</title>
<style>
	* { box-sizing: border-box; }
	body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; color: #18181b; background: #f4f4f5; }
	.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
	aside { background: #fff; border-right: 1px solid #e4e4e7; padding: 20px 14px; }
	.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; padding: 0 8px 22px; }
	.brand i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #a855f7); }
	nav a { display: block; padding: 8px 10px; border-radius: 8px; color: #52525b; text-decoration: none; margin-bottom: 2px; }
	nav a.on { background: #eef2ff; color: #4338ca; font-weight: 600; }
	main { padding: 26px 32px 40px; min-width: 0; }
	header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
	h1 { font-size: 24px; margin: 0; letter-spacing: -.02em; }
	.range { margin-left: auto; display: flex; background: #fff; border: 1px solid #e4e4e7; border-radius: 10px; padding: 3px; }
	.range span { padding: 5px 12px; border-radius: 7px; color: #71717a; }
	.range span.on { background: #18181b; color: #fff; }
	.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
	.card, .kpi { background: #fff; border: 1px solid #e4e4e7; border-radius: 14px; }
	.kpi { padding: 16px 18px; }
	.kpi .label { color: #71717a; font-size: 13px; }
	.kpi .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
	.delta { font-size: 12.5px; font-weight: 600; margin-top: 4px; }
	.delta span { color: #a1a1aa; font-weight: 400; }
	.delta.up { color: #16a34a; } .delta.down { color: #dc2626; }
	.card { padding: 18px 20px; margin-bottom: 18px; }
	.card h2 { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
	.card h2 small { color: #a1a1aa; font-weight: 400; font-size: 13px; }
	.chart { width: 100%; height: auto; display: block; }
	.grid { stroke: #f0f0f2; }
	.area { fill: #6366f11a; } .line { fill: none; stroke: #6366f1; stroke-width: 2.5; stroke-linejoin: round; }
	.dot { fill: #fff; stroke: #6366f1; stroke-width: 2; }
	.bar { fill: #c7d2fe; } .bar.top { fill: #6366f1; }
	.best { font: 600 12px -apple-system, system-ui; fill: #4338ca; text-anchor: middle; }
	button.ghost { margin-left: auto; border: 1px solid #e4e4e7; background: #fff; border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; color: #3f3f46; }
	.toolbar { display: flex; align-items: center; gap: 8px; margin: -2px 0 14px; }
	.search { flex: 0 0 260px; border: 1px solid #e4e4e7; border-radius: 9px; padding: 6px 12px; color: #a1a1aa; }
	.chip { border: 1px solid #e4e4e7; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: #52525b; }
	.chip.on { background: #18181b; color: #fff; border-color: #18181b; }
	table { width: 100%; border-collapse: collapse; }
	th { text-align: left; font-weight: 500; color: #71717a; font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid #e4e4e7; }
	td { padding: 11px 10px; border-bottom: 1px solid #f4f4f5; }
	tr:last-child td { border-bottom: 0; }
	.num { text-align: right; font-variant-numeric: tabular-nums; }
	th.num { text-align: right; }
	.mono { font-family: 'SF Mono', Menlo, monospace; font-size: 13px; color: #52525b; }
	.muted { color: #71717a; }
	.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
	.pill.blue { background: #dbeafe; color: #1d4ed8; } .pill.amber { background: #fef3c7; color: #b45309; }
	.pill.green { background: #dcfce7; color: #15803d; } .pill.red { background: #fee2e2; color: #b91c1c; }
</style>
</head>
<body>
<div class="shell">
	<aside>
		<div class="brand"><i></i>Acme</div>
		<nav>
			<a class="on" href="/">Overview</a>
			<a href="/">Orders</a>
			<a href="/">Customers</a>
			<a href="/">Products</a>
			<a href="/">Settings</a>
		</nav>
	</aside>
	<main>
		<header>
			<h1>Overview</h1>
			<div class="range"><span>24h</span><span class="on">7d</span><span>30d</span><span>12m</span></div>
		</header>
		<section class="kpis"><!--KPIS--></section>
		<section class="card" id="revenue">
			<h2><!--CHART_TITLE--> <small>USD, thousands</small></h2>
			<!--CHART-->
		</section>
		<section class="card" id="orders">
			<h2>Recent orders <!--EXPORT--></h2>
			<!--TOOLBAR-->
			<table>
				<thead><tr><th>Order</th><th>Customer</th><th>Date</th><th class="num">Amount</th><th>Status</th></tr></thead>
				<tbody><!--ROWS--></tbody>
			</table>
		</section>
	</main>
</div>
<script>new EventSource('/__reload').onmessage = () => location.reload();</script>
</body>
</html>
